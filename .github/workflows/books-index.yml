name: Baza wiedzy z książek — indeks

on:
  push:
    branches: [ main ]
    paths:
      - 'knowledge/books/**'
      - '.github/scripts/build_books_index.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: books-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zbuduj indeks reguł
        run: node .github/scripts/build_books_index.js

      - name: Zapisz indeks w repo
        run: |
          if git diff --quiet -- knowledge/books-index.json; then
            echo "Indeks aktualny — nic do zapisania."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/books-index.json
          git commit -m "Baza wiedzy z książek: odśwież indeks"
          git push
