name: Sprawdzenie kodu

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sprawdzenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. Sprawdź składnię wszystkich plików JS
        run: |
          echo "Sprawdzam skladnie kazdego pliku .js..."
          for f in *.js; do
            echo "  -> $f"
            node --check "$f"
          done
          echo "Wszystkie pliki JS maja poprawna skladnie."

      - name: 1b. Testy wskazówki i filmu przy ćwiczeniu
        run: node .github/scripts/test_coach_media.js

      - name: 1c. Testy warstwy klienta dla coach media
        run: node .github/scripts/test_client_portal_coach_media.js
      - name: 1c2. Testy GIF-ów techniki ćwiczeń
        run: node .github/scripts/test_ex_gif.js
      - name: 1c2a. Testy importu GIF/MP4
        run: node .github/scripts/test_ex_gif_import.js
      - name: 1c2a2. Testy przypisania MP4 do wybranego ćwiczenia
        run: node .github/scripts/test_ex_assign_mp4.js
      - name: 1c2b. Testy filmów MP4 w bibliotece ćwiczeń
        run: node .github/scripts/test_ex_video_manifest.js
      - name: 1c2c. Testy dopasowania plików filmów do ćwiczeń
        run: node .github/scripts/test_ex_file_match.js
      - name: 1c2d. Testy przewodnika Hack Squat
        run: node .github/scripts/test_hack_squat_guide.js
      - name: 1c3. Testy własnych filmów trenera
        run: node .github/scripts/test_own_videos.js
      - name: 1c4. Testy wygaszacza z logo
        run: node .github/scripts/test_screensaver.js
      - name: 1b. Testy %1RM → kg
        run: node .github/scripts/test_1rm.js

      - name: 1c. Testy super-serii
        run: node .github/scripts/test_supersets.js

      - name: 1d. Testy nawyków / streak
        run: node .github/scripts/test_habits.js

      - name: 1d2. Testy Progress Nawyki (port)
        run: node .github/scripts/test_habits_nawyki_port.js

      - name: 1e. Testy rekordów / historii ćwiczenia
        run: node .github/scripts/test_exercise_pr.js

      - name: 1e2. Testy jednostki kg/sec w ćwiczeniach czasowych
        run: node .github/scripts/test_ex_load_unit.js

      - name: 1f. Testy regresji portalu rekordów
        run: node .github/scripts/test_exercise_pr_portal.js
      - name: 1e. Testy warmup / drop / AMRAP
        run: node .github/scripts/test_set_kinds.js
      - name: 1e. Testy wyzwań
        run: node .github/scripts/test_challenges.js

      - name: 1f. Testy formularzy klienta
        run: node .github/scripts/test_forms.js

      - name: 1g. Testy oceny treningu i historii
        run: node .github/scripts/test_session_history.js
      - name: 1g1. Testy Live Postęp → zapis sesji
        run: node .github/scripts/test_live_session_progress.js
      - name: 1g2. Testy oznaczenia odbytego treningu w kalendarzu
        run: node .github/scripts/test_cal_session_done.js

      - name: 1h. Testy regresji historii treningów
        run: node .github/scripts/test_workout_rate_history_fixes.js
      - name: 1h2. Testy rotacji sugerowanego dnia planu
        run: node .github/scripts/test_suggested_plan_day.js
      - name: 1g. Testy EMOM
        run: node .github/scripts/test_emom.js

      - name: 1i. Testy wiring kreatora WU/DROP/AMRAP + film
        run: node .github/scripts/test_builder_kinds_media.js

      - name: 1i0. Testy własnego czasu w timerze przerwy live
        run: node .github/scripts/test_live_rest_custom.js

      - name: 1i2. Testy kart ćwiczeń w builderze (zamienniki / kolory)
        run: node .github/scripts/test_builder_ex_cards.js

      - name: 1i3. Testy etykiet dnia wg metody (Push/Pull/FBW)
        run: node .github/scripts/test_builder_day_method.js

      - name: 1i4. Testy uzasadnienia metodycznego (dlaczego serie/metoda)
        run: node .github/scripts/test_method_rationale.js

      - name: 1i4b. Testy metody Trening obwodowy
        run: node .github/scripts/test_circuit_method.js

      - name: 1i5. Testy bazy dowodów / zasad trenera
        run: node .github/scripts/test_evidence_base.js

      - name: 1i6. Testy tooltipów edukacyjnych (serie/RPE/metoda)
        run: node .github/scripts/test_edu_tooltips.js

      - name: 1i7. Testy scrolla sidebara kreatora
        run: node .github/scripts/test_builder_sidebar_scroll.js

      - name: 1i7b. Testy korekt UX (Więcej / sidebar / rationale)
        run: node .github/scripts/test_korekta_ux.js

      - name: 1j. Testy parsera JSON generatora AI
        run: node .github/scripts/test_ai_plan_json.js

      - name: 1j2. Testy edytora tempo w generatorze AI
        run: node .github/scripts/test_apl_tempo_editor.js

      - name: 1k. Testy zasobów YouTube i Garmin CSV
        run: node .github/scripts/test_resources_garmin.js

      - name: 1l. Testy portalu On-demand YouTube
        run: node .github/scripts/test_ondemand_youtube.js

      - name: 1l2. Testy zadań domowych klienta
        run: node .github/scripts/test_homework_client.js

      - name: 1m. Testy sportów w planowaniu i statystyk klienta
        run: node .github/scripts/test_client_sports_stats.js

      - name: 1n. Testy przepływu klienta (priorytet / baseline / kalendarz)
        run: node .github/scripts/test_client_flow_helpers.js

      - name: 1n3. Testy tygodniowego check-inu (audit flow)
        run: node .github/scripts/test_checkin_weekly.js

      - name: 1n4. Testy sync wagi z check-inu
        run: node .github/scripts/test_checkin_sync.js

      - name: 1n5. Testy archiwizacji / usuwania klienta
        run: node .github/scripts/test_client_delete.js

      - name: 1n6. Testy deep-link check-inu / formularzy (apka klienta)
        run: node .github/scripts/test_client_deeplink.js

      - name: 1n7. Testy zapisu klienta do forum (onboard)
        run: node .github/scripts/test_forum_enroll.js

      - name: 1n9. Testy kanałów zaproszenia (mailto / WhatsApp)
        run: node .github/scripts/test_invite_channels.js

      - name: 1n9b. Testy logowania klienta / zapisu invites
        run: node .github/scripts/test_client_app_login.js

      - name: 1n10. Testy prośby o wpłatę / appJoined
        run: node .github/scripts/test_onboard_pay_join.js

      - name: 1n12. Testy follow-upu formularzy (dashboard + ankieta wstępna)
        run: node .github/scripts/test_dash_forms_followup.js
      - name: 1n12b. Testy panelu operacyjnego (dashboard)
        run: node .github/scripts/test_dash_ops_panel.js
      - name: 1n11. Testy widoczności płatności (klient + dashboard)
        run: node .github/scripts/test_client_payments_visible.js

      - name: 1n13. Testy follow-upu zadań domowych (dashboard)
        run: node .github/scripts/test_dash_homework_followup.js

      - name: 1n14. Testy follow-upu wiadomości (dashboard)
        run: node .github/scripts/test_dash_msg_followup.js

      - name: 1n15. Testy follow-upu nawyków / wyzwań (dashboard)
        run: node .github/scripts/test_dash_habits_followup.js

      - name: 1n19. Testy ukrycia stuba żywienia / uczciwych dokumentów
        run: node .github/scripts/test_hide_food_stub.js
      - name: "1n22. Testy: skrypty w index.html tylko raz"
        run: node .github/scripts/test_index_scripts_once.js
      - name: 1n25. Testy Overview profilu (układ Everfit)
        run: node .github/scripts/test_cp_overview_everfit.js
      - name: 1n25b. Testy statusu, sylwetki i zwiniętego kalendarza w profilu
        run: node .github/scripts/test_cp_pulse_scan.js
      - name: 1n26. Testy uproszczenia nawigacji profilu klienta
        run: node .github/scripts/test_cp_nav_simplify.js
      - name: 1n26b. Testy widocznej edycji danych klienta
        run: node .github/scripts/test_cp_edit_visible.js
      - name: Hover Edycja na liście klientów
        run: node .github/scripts/test_client_hover_edit.js
      - name: 1n27. Testy układu aplikacji (sidebar Everfit)
        run: node .github/scripts/test_app_shell_everfit.js
      - name: Szablony vs Programy (mikro/makro)
        run: node .github/scripts/test_templates_vs_programs.js
      - name: 1n27b. Testy wejścia do planu tylko z klienta
        run: node .github/scripts/test_nav_plan_entry.js
      - name: 1n27c. Testy skróconego primary nav
        run: node .github/scripts/test_nav_primary_slim.js
      - name: 1n27c2. Testy domyślnego Panelu głównego
        run: node .github/scripts/test_nav_home_default.js
      - name: 1n27d. Testy mini-listy klientów w sidebarze
        run: node .github/scripts/test_nav_clients_sidebar.js
      - name: 1n27e. Testy zachowania zakładki przy zmianie klienta
        run: node .github/scripts/test_cp_tab_persist.js
      - name: 1n28. Testy poziomych zakładek profilu klienta
        run: node .github/scripts/test_cp_tabs_top.js
      - name: 1n28c. Testy slim zakładek profilu (Analityka)
        run: node .github/scripts/test_cp_tabs_slim.js
      - name: 1n28b. Testy przycisku własnego planu w profilu klienta
        run: node .github/scripts/test_cp_own_plan_btn.js
      - name: 1n28c. Testy braku duplikacji CTA planu w profilu
        run: node .github/scripts/test_cp_plan_dedupe.js
      - name: 1n28d. Testy jednego planu na dzień w grafiku Assignment
        run: node .github/scripts/test_cp_cal_plan_dedupe.js
      - name: 1n29. Testy przywrócenia konturów/czcionek kafelków
        run: node .github/scripts/test_tile_polish_restore.js
      - name: 1n30. Testy etykiet partii w autocomplete ćwiczeń
        run: node .github/scripts/test_ex_ac_muscle_label.js
      - name: 1n31. Testy zdjęć w bibliotece ćwiczeń
        run: node .github/scripts/test_lib_ex_photos.js
      - name: 1n31b. Testy polskich nazw ćwiczeń w bibliotece
        run: node .github/scripts/test_ex_names_pl.js
      - name: 1n31b2. Testy ćwiczeń z atlasu TFS
        run: node .github/scripts/test_atlas_tfs_ex.js
      - name: 1n31b3. Testy deduplikacji biblioteki ćwiczeń
        run: node .github/scripts/test_ex_lib_dedupe.js
      - name: 1n31b4. Testy usuwania ćwiczenia z biblioteki
        run: node .github/scripts/test_lib_del_ex.js
      - name: 1n31c. Testy podsumowania start + monitoring klienta
        run: node .github/scripts/test_client_journey_summary.js
      - name: 1n32. Testy periodyzacji RPE/RIR w kreatorze
        run: node .github/scripts/test_period_rpe_rir.js
      - name: 1n24. Testy braku fałszywych pomiarów demo
        run: node .github/scripts/test_no_fake_metrics.js
      - name: 1n24b. Testy obwodów centymetrem
        run: node .github/scripts/test_circ_metrics.js
      - name: 1n23. Testy usunięcia DEMO_NOTIFS
        run: node .github/scripts/test_demo_notifs_cleanup.js
      - name: 1n21. Testy sekcji nawigacji apki klienta (forum / kalendarz)
        run: node .github/scripts/test_cap_nav_sections.js
      - name: 1n20. Testy przełącznika pomiarów ciała (bodyMetrics)
        run: node .github/scripts/test_body_metrics_toggle.js
      - name: 1n18. Testy dopełniania kalendarza / zdjęć sylwetki (dashboard)
        run: node .github/scripts/test_dash_cal_photo_followup.js
      - name: 1n17. Testy polish audytu (check-in refresh / badge / archiwum)
        run: node .github/scripts/test_audit_polish.js
      - name: 1n16. Testy PDF formularzy / dedupe ankiety wstępnej
        run: node .github/scripts/test_form_pdf_dedupe.js

      - name: 1n8. Testy webhooków integracji (Zapier/Make)
        run: node .github/scripts/test_integrations_webhooks.js

      - name: 1n2. Testy programu → plan z ćwiczeniami (Automatyzacja)
        run: node .github/scripts/test_program_plan_days.js

      - name: 1o. Testy edycji pomiarów w profilu klienta
        run: node .github/scripts/test_cp_metrics_edit.js

      - name: 1p. Testy kontekstu pomiarów w generatorze AI
        run: node .github/scripts/test_ai_metrics_context.js
      - name: 1p2. Testy bezpieczeństwa planu AI (waga/postawa)
        run: node .github/scripts/test_ai_plan_safety.js
      - name: Testy PDF planu AI (kolory wzoru)
        run: node .github/scripts/test_plan_pdf.js
      - name: 1p3. Testy nadwagi i strażnika postępów AI
        run: node .github/scripts/test_ai_bmi_watchdog.js

      - name: Testy sync uwag AI vs metoda
        run: node .github/scripts/test_apl_notes_method_sync.js
      - name: Testy metod AI (Split/Smolov) + progresja
        run: node .github/scripts/test_apl_method_progression.js
      - name: Testy zapisu płci i sprzętu w generatorze AI
        run: node .github/scripts/test_apl_form_persist.js
      - name: 1o2. Testy zakładki Progress (statystyki klienta)
        run: node .github/scripts/test_cp_progress_tab.js
      - name: Panel analityczny klienta (Progress)
        run: node .github/scripts/test_cp_analytics_panel.js

      - name: 2. Sprawdź duplikaty (funkcje / id / zmienne)
        run: python3 .github/scripts/check_duplicates.py

      - name: 3. Sprawdź czy wszystkie odwołania do plików są poprawne
        run: python3 .github/scripts/check_file_refs.py

      - name: 4. Zainstaluj przeglądarkę testową
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 5. Uruchom lokalny serwer
        run: python3 -m http.server 8080 &

      - name: 6. Poczekaj aż serwer wystartuje
        run: sleep 2

      - name: 6b. Testy layoutu podglądu planu w przeglądarce
        run: node .github/scripts/test_plan_preview_layout.js
      - name: 6b. Testy layoutu generatora / biblioteki / kalkulatora
        run: node .github/scripts/test_ai_gen_layout.js
      - name: 6b1. Testy UI PDF planu AI
        run: node .github/scripts/test_plan_pdf_ui.js
      - name: 6b1. Testy UI zapisu płci i sprzętu w generatorze
        run: node .github/scripts/test_apl_form_persist_ui.js
      - name: 6b2. Testy UI zamienników i miniatury techniki w kreatorze
        run: node .github/scripts/test_builder_alts_media_ui.js

      - name: 6b3. Testy UI cardio w wyszukiwarce ćwiczeń
        run: node .github/scripts/test_cardio_ex_ac_ui.js
      - name: 6b3b. Testy UI filmów MP4 w bibliotece ćwiczeń
        run: node .github/scripts/test_lib_ex_video_ui.js
      - name: 6b3b2. Testy UI importu MP4 do biblioteki
        run: node .github/scripts/test_ex_gif_import_ui.js
      - name: 6b3b3. Testy UI przypisania MP4 do ćwiczenia
        run: node .github/scripts/test_ex_assign_mp4_ui.js
      - name: 6b3c. Testy UI timera przerwy live (30s / własny)
        run: node .github/scripts/test_live_rest_ui.js
      - name: 6b3c2. Testy UI Live Postęp i zapisu do Progress
        run: node .github/scripts/test_live_progress_ui.js

      - name: 6b4. Testy UI jednostki sec przy linach
        run: node .github/scripts/test_ex_load_unit_ui.js

      - name: 6c. Testy UI zasobów YouTube i Garmin CSV
        run: node .github/scripts/test_resources_garmin_ui.js

      - name: 6d. Testy UI portalu On-demand YouTube
        run: node .github/scripts/test_ondemand_youtube_ui.js

      - name: 6e. Testy UI wygaszacza z logo
        run: node .github/scripts/test_screensaver_ui.js
      - name: 6f. Testy UI nadwagi i strażnika w asystencie
        run: node .github/scripts/test_ai_bmi_watchdog_ui.js
      - name: 6f2. Testy UI edycji imienia i nazwiska w profilu
        run: node .github/scripts/test_cp_edit_visible_ui.js
      - name: 6g. Testy UI obwodów centymetrem w profilu klienta
        run: node .github/scripts/test_circ_metrics_ui.js

      - name: 7. Sprawdź stronę w prawdziwej przeglądarce
        run: node .github/scripts/check_browser.js

      - name: Podsumowanie
        if: success()
        run: echo "✅ Wszystkie sprawdzenia przeszły pomyślnie."
