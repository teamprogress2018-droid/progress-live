name: Izolacja danych trenerów i klientów
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'server/ai-proxy/**', 'server/automation/**', '.github/workflows/tenant-isolation-check.yml']
  pull_request:
    paths: ['firestore.rules', 'storage.rules', 'server/ai-proxy/**', 'server/automation/**', '.github/workflows/tenant-isolation-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tenant-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Przygotuj zależności wyłącznie lokalnego emulatora
        run: |
          node server/automation/prepare-deploy.cjs
          npm install --prefix server/automation/.runtime --ignore-scripts --no-audit --no-fund
          npm install --prefix server/automation/.runtime --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.12.0
      - name: Rzeczywiste reguły dostępu, transakcje i próby dostępu do obcych danych
        run: >-
          server/automation/.runtime/node_modules/.bin/firebase emulators:exec
          --only firestore --project demo-progress-autoflow
          --config server/automation/firebase.tenant.test.json
          "node server/automation/test-tenant-rules.cjs"
      - name: Pliki (Storage) tylko dla kont z nadaną rolą trenera
        run: >-
          server/automation/.runtime/node_modules/.bin/firebase emulators:exec
          --only firestore,storage --project demo-progress-autoflow
          --config server/automation/firebase.storage.test.json
          "node server/automation/test-storage-rules.cjs"
      - name: Pośrednik AI — bez roli trenera 403, limit dzienny
        run: node server/ai-proxy/test-worker.mjs
