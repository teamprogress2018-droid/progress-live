<rect x="730" y="494" width="240" height="54" rx="6" fill="#e6f4ec" stroke="#2e8b57" stroke-opacity=".35"/>
<text x="740" y="516" font-size="12.5" fill="#222">martwy ciąg walizkowy, chop/lift</text>
<text x="24" y="586" font-size="14" font-weight="600" fill="#1a1a1a">Głęboki przysiad</text>
