<rect x="730" y="556" width="240" height="54" rx="6" fill="#e6f4ec" stroke="#2e8b57" stroke-opacity=".35"/>
<text x="740" y="578" font-size="12.5" fill="#222">tureckie wstawanie, martwy ciąg</text>
<text x="24" y="654" font-size="11" fill="#777">Opracowanie własne Progress Live na podstawie: G. Cook, The Business of Movement (2022), s. 188, 226, 361. Wybrane przykłady, nie pełna lista.</text></svg>