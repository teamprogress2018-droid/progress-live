<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 676" role="img" aria-label="Światła FMS – dobór ćwiczeń" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="980" height="676" fill="#fff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1a1a1a">Światła FMS – dobór ćwiczeń przy słabym wzorcu</text>
<text x="24" y="62" font-size="13" fill="#555">Czerwone = ocena 0, 1 lub asymetria 1/2 · Żółte = ocena 2 lub asymetria 2/3 · Zielone = bezpieczne. Ocena 0 (ból) → najpierw specjalista.</text>
<rect x="230" y="80" width="240" height="30" rx="6" fill="#d64545"/><text x="350" y="100" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">UNIKAJ</text>
<rect x="480" y="80" width="240" height="30" rx="6" fill="#c99700"/><text x="600" y="100" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">OSTROŻNIE + retest</text>
<rect x="730" y="80" width="240" height="30" rx="6" fill="#2e8b57"/><text x="850" y="100" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">BEZPIECZNE</text>
<text x="24" y="152" font-size="14" font-weight="600" fill="#1a1a1a">ASLR (unoszenie nogi)</text>
