<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 345" role="img" aria-label="Fazy periodyzacji siły" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="1030" height="345" fill="#fff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1a1a1a">Fazy treningu siły w sezonie</text>
<text x="24" y="62" font-size="13" fill="#555">Zawsze zaczynaj od adaptacji anatomicznej. Minimum przed pracą nad mocą: ok. 11 tygodni.</text>
<path d="M24 90 h156 l14 40 l-14 40 h-156 l14 -40 z" fill="#7aa6d6"/>
<text x="113.0" y="135" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Adaptacja anatomiczna</text>
<text x="32" y="200" font-size="11" fill="#777">Czas</text><text x="32" y="216" font-size="13" fill="#222">≥3 tyg. (początk. 8–12)</text>
<text x="32" y="240" font-size="11" fill="#777">Serie × powt.</text><text x="32" y="256" font-size="13" fill="#222">2–3 × 8–20</text>
<text x="32" y="280" font-size="11" fill="#777">% 1RM</text><text x="32" y="296" font-size="13" fill="#222">40–65%</text>
<path d="M198 90 h156 l14 40 l-14 40 h-156 l14 -40 z" fill="#3d6fb0"/>
<text x="287.0" y="135" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Siła maksymalna</text>
<text x="206" y="200" font-size="11" fill="#777">Czas</text><text x="206" y="216" font-size="13" fill="#222">≥4 tyg. (1–3 mies.)</text>
<text x="206" y="240" font-size="11" fill="#777">Serie × powt.</text><text x="206" y="256" font-size="13" fill="#222">3–8 × 1–6</text>
<text x="206" y="280" font-size="11" fill="#777">% 1RM</text><text x="206" y="296" font-size="13" fill="#222">70–90%</text>
<path d="M372 90 h146 l14 40 l-14 40 h-146 l14 -40 z" fill="#e08a2e"/>
<text x="456.0" y="135" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Konwersja na moc</text>
<text x="380" y="200" font-size="11" fill="#777">Czas</text><text x="380" y="216" font-size="13" fill="#222">≥4 tyg. (4–8)</text>
<text x="380" y="240" font-size="11" fill="#777">Serie × powt.</text><text x="380" y="256" font-size="13" fill="#222">1–10, szybko</text>
<text x="380" y="280" font-size="11" fill="#777">% 1RM</text><text x="380" y="296" font-size="13" fill="#222">40–80%</text>
<path d="M536 90 h156 l14 40 l-14 40 h-156 l14 -40 z" fill="#6c9a5a"/>
<text x="625.0" y="135" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Utrzymanie (sezon)</text>
<text x="544" y="200" font-size="11" fill="#777">Czas</text><text x="544" y="216" font-size="13" fill="#222">cały sezon</text>
<text x="544" y="240" font-size="11" fill="#777">Serie × powt.</text><text x="544" y="256" font-size="13" fill="#222">2–4 × 1–6, 2–5 ćw.</text>
<text x="544" y="280" font-size="11" fill="#777">% 1RM</text><text x="544" y="296" font-size="13" fill="#222">60–80%</text>
<path d="M710 90 h136 l14 40 l-14 40 h-136 l14 -40 z" fill="#9a9a9a"/>
<text x="789.0" y="135" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Zawieszenie</text>
<text x="718" y="200" font-size="11" fill="#777">Czas</text><text x="718" y="216" font-size="13" fill="#222">3–14 dni przed startem</text>
<text x="718" y="240" font-size="11" fill="#777">Serie × powt.</text><text x="718" y="256" font-size="13" fill="#222">bez siły</text>
<text x="718" y="280" font-size="11" fill="#777">% 1RM</text><text x="718" y="296" font-size="13" fill="#222">—</text>
<path d="M864 90 h106 l14 40 l-14 40 h-106 l14 -40 z" fill="#b5b5b5"/>
<text x="928.0" y="135" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Kompensacja</text>
<text x="872" y="200" font-size="11" fill="#777">Czas</text><text x="872" y="216" font-size="13" fill="#222">2–4 tyg.</text>
<text x="872" y="240" font-size="11" fill="#777">Serie × powt.</text><text x="872" y="256" font-size="13" fill="#222">aktywny wypoczynek</text>
<text x="872" y="280" font-size="11" fill="#777">% 1RM</text><text x="872" y="296" font-size="13" fill="#222">lekko</text>
<text x="24" y="335" font-size="11" fill="#777">Opracowanie własne Progress Live na podstawie: T. Bompa, C. Buzzichelli, Periodyzacja (wyd. hiszp.), s. 112–118, 280–285. Etap 1 siły maks. w źródle także 40–80% 1RM.</text></svg>