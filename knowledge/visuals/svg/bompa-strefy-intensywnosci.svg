<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="Strefy intensywności" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="1000" height="490" fill="#fff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1a1a1a">Strefy intensywności</text>
<text x="24" y="66" font-size="15" font-weight="600" fill="#333">Siła (% ciężaru maksymalnego 1RM)</text>
<rect x="24" y="170" width="150" height="40" rx="5" fill="#cfe3f5"/>
<text x="99" y="200" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">20–50%</text>
<text x="99" y="230" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle">Niska</text><text x="99" y="247" font-size="11" fill="#666" text-anchor="middle">wytrzymałość mięśniowa</text>
<rect x="182" y="148" width="150" height="62" rx="5" fill="#a9cdee"/>
<text x="257" y="200" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">50–70%</text>
<text x="257" y="230" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle">Średnia</text><text x="257" y="247" font-size="11" fill="#666" text-anchor="middle">technika, objętość, moc lekkim</text>
<rect x="340" y="126" width="150" height="84" rx="5" fill="#7aa6d6"/>
<text x="415" y="200" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">70–80%</text>
<text x="415" y="230" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle">Średnio ciężka</text><text x="415" y="247" font-size="11" fill="#666" text-anchor="middle">siła maks. – koordynacja</text>
<rect x="498" y="104" width="150" height="106" rx="5" fill="#4f86c4"/>
<text x="573" y="200" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">80–90%</text>
<text x="573" y="230" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle">Ciężka</text><text x="573" y="247" font-size="11" fill="#666" text-anchor="middle">siła maks.</text>
<rect x="656" y="82" width="150" height="128" rx="5" fill="#2f5f9e"/>
<text x="731" y="200" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">90–100%</text>
<text x="731" y="230" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle">Maksymalna</text><text x="731" y="247" font-size="11" fill="#666" text-anchor="middle">siła maks. – mało powt.</text>
<rect x="814" y="60" width="150" height="150" rx="5" fill="#1d3d6b"/>
<text x="889" y="200" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">100–125%</text>
<text x="889" y="230" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle">Supramaksymalna</text><text x="889" y="247" font-size="11" fill="#666" text-anchor="middle">tylko b. zaawansowani, rzadko</text>
<text x="24" y="290" font-size="15" font-weight="600" fill="#333">Wytrzymałość – 6 stref</text>
<rect x="24" y="306" width="34" height="40" rx="5" fill="#8b1e1e"/><text x="41" y="332" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="68" y="323" font-size="13" font-weight="600" fill="#222">Alaktyczna</text><text x="68" y="340" font-size="11.5" fill="#555">2–8 s, ponad 95%, bardzo długie przerwy</text>
<rect x="504" y="306" width="34" height="40" rx="5" fill="#c0392b"/><text x="521" y="332" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="548" y="323" font-size="13" font-weight="600" fill="#222">Tolerancja mleczanu</text><text x="548" y="340" font-size="11.5" fill="#555">15–90 s, maks. 2× w tygodniu</text>
<rect x="24" y="356" width="34" height="40" rx="5" fill="#e67e22"/><text x="41" y="382" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="68" y="373" font-size="13" font-weight="600" fill="#222">VO2max</text><text x="68" y="390" font-size="11.5" fill="#555">1–6 min przy 90–100% VO2max</text>
<rect x="504" y="356" width="34" height="40" rx="5" fill="#f1c40f"/><text x="521" y="382" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="548" y="373" font-size="13" font-weight="600" fill="#222">Próg beztlenowy</text><text x="548" y="390" font-size="11.5" fill="#555">odcinki 1–15 min, „lekko szybciej niż wygodnie”</text>
<rect x="24" y="406" width="34" height="40" rx="5" fill="#7dbb5a"/><text x="41" y="432" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="68" y="423" font-size="13" font-weight="600" fill="#222">Próg tlenowy</text><text x="68" y="440" font-size="11.5" fill="#555">ciągle lub odcinki ponad 10 min, HR ok. 130–150</text>
<rect x="504" y="406" width="34" height="40" rx="5" fill="#9fd3e6"/><text x="521" y="432" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="548" y="423" font-size="13" font-weight="600" fill="#222">Regeneracja</text><text x="548" y="440" font-size="11.5" fill="#555">45–60% VO2max, 5–20 min po ciężkiej sesji</text>
<text x="24" y="478" font-size="11" fill="#777">Opracowanie własne Progress Live na podstawie: T. Bompa, C. Buzzichelli, Periodyzacja (wyd. hiszp.), s. 262–263, 320–323.</text></svg>